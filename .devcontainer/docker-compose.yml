services:

  typescript:
    build:
      context: .
      dockerfile: Dockerfile.typescript
    volumes:
      - ../typescript:/workspace/typescript:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      mongo-database:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - ../python:/workspace/python:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      mongo-database:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  golang:
    build:
      context: .
      dockerfile: Dockerfile.golang
    volumes:
      - ../golang:/workspace/golang:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      mongo-database:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  java:
    build:
      context: .
      dockerfile: Dockerfile.java
    volumes:
      - ../java:/workspace/java:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      mongo-database:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  ruby:
    build:
      context: .
      dockerfile: Dockerfile.ruby
    volumes:
      - ../ruby:/workspace/ruby:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      mongo-database:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  mongo-database:
    image: mongodb/mongodb-community-server:latest
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  init-db:
    build:
      context: .
      dockerfile: Dockerfile.mongodb-data
    restart: on-failure
    depends_on:
      mongo-database:
        condition: service_healthy

volumes:
  mongodb-data:
